# Nginx Reverse Proxy - Production Ready Configuration
# Portfolio & Blog API Gateway
#
# Note: Rate limiting zones must be defined in nginx main http block.
# To enable rate limiting in production, add these to /etc/nginx/nginx.conf http block:
#   limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
#   limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
#   limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=20r/h;

server {
    listen 80;
    server_name localhost;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1000;

    # Common Proxy Settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ----------------------------------------------------
    # API Documentation (Swagger / ReDoc)
    # ----------------------------------------------------
    location /docs {
        proxy_pass http://backend:8000/docs;
    }

    location /redoc {
        proxy_pass http://backend:8000/redoc;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/api/v1/openapi.json;
    }

    # ----------------------------------------------------
    # Authentication Endpoints
    # ----------------------------------------------------
    location /api/v1/auth/ {
        proxy_pass http://backend:8000;
    }

    # ----------------------------------------------------
    # Media Upload (Large Body Allowed)
    # ----------------------------------------------------
    location /api/v1/media/ {
        client_max_body_size 10M;
        proxy_pass http://backend:8000;
    }

    # ----------------------------------------------------
    # General API Routes
    # ----------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
    }

    # ----------------------------------------------------
    # Health Check
    # ----------------------------------------------------
    location /health {
        proxy_pass http://backend:8000/health;
    }

    location = / {
        proxy_pass http://backend:8000/;
    }

    # Error Pages
    error_page 502 503 504 /50x.json;
    location = /50x.json {
        default_type application/json;
        return 502 '{"error":"service_unavailable","message":"Backend service is temporarily unavailable."}';
    }
}