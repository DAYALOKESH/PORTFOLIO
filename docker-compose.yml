version: '3.8'

services:
  # -----------------------------------------------------------------
  # LAYER 3: DATA PERSISTENCE
  # -----------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: portfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio_dev_password
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: portfolio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # -----------------------------------------------------------------
  # LAYER 3: BACKEND API
  # -----------------------------------------------------------------
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: portfolio_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://portfolio:portfolio_dev_password@db:5432/portfolio_db
      REDIS_URL: redis://redis:6379/0
    # We don't expose port 8000 directly to host to force traffic through Nginx (Middleware)
    expose:
      - "8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # -----------------------------------------------------------------
  # LAYER 2: MIDDLEWARE (Reverse Proxy / Gateway)
  # -----------------------------------------------------------------
  proxy:
    image: nginx:alpine
    container_name: portfolio_middleware
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80" # Host Port 8080 maps to Nginx Port 80
    volumes:
      - ./middleware/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  redis_data: